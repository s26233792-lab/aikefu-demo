[project]
name = "xhs-kefu-demo"
version = "1.0.0"
description = "小红书千帆网页版客服 Agent 演示（真实场景，参考 dxl-commerce-agent 架构）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
worker = ["playwright>=1.44", "websocket-client>=1.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
