<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>栀夏 ZHIXIA 女装客服 Agent · Demo</title>
<style>
  :root {
    --xhs-red: #245c47;
    --xhs-bg: #f4f1e9;
    --panel-bg: #fffdf8;
    --border: #ddd8cb;
    --text: #1f2924;
    --muted: #738078;
    --green: #2f7d58;
    --orange: #c56d3c;
    --blue: #356b57;
    --shadow: 0 12px 36px rgba(42, 56, 48, .08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "HarmonyOS Sans SC", "MiSans", "PingFang SC", sans-serif;
    background: var(--xhs-bg);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: rgba(255, 253, 248, .94);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    min-height: 68px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header .logo { font-family:"STSong", "Songti SC", serif; font-weight:700; color:var(--xhs-red); font-size:20px; display:flex; align-items:center; gap:10px; letter-spacing:.02em; }
  header .logo .badge { font-family:inherit; font-size:11px; background:#e6eee8; color:var(--xhs-red); padding:4px 9px; border-radius:999px; font-weight:600; letter-spacing:.08em; }
  header .status { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); background:#f5f2e9; border:1px solid var(--border); padding:7px 10px; border-radius:999px; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--green); }
  .dot.warn { background: var(--orange); }
  main {
    flex: 1;
    display: grid;
    grid-template-columns: minmax(0, 1.15fr) minmax(420px, .85fr);
    gap: 0;
    overflow: hidden;
  }
  .pane { display:flex; flex-direction:column; overflow:hidden; }
  .pane.left { border-right:1px solid var(--border); background:var(--panel-bg); }
  .pane.right { background: #f7f5ef; }
  .pane-title {
    min-height: 56px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
    border-bottom: 1px solid var(--border);
    background: rgba(255, 253, 248, .96);
    display:flex; align-items:center; justify-content:space-between;
  }
  .scene-tabs { display:flex; gap:8px; overflow-x:auto; scrollbar-width:thin; padding:4px 0; }
  .scene-tab {
    padding: 7px 12px; border-radius: 999px; cursor: pointer;
    font-size: 13px; border:1px solid var(--border); background:#fff; color:var(--text);
    transition: all .15s; flex:0 0 auto; white-space:nowrap;
  }
  .scene-tab.active { background: var(--xhs-red); color:#fff; border-color:var(--xhs-red); box-shadow:0 6px 16px rgba(36,92,71,.18); }
  .scene-tab[data-scene="security"].active { background:#8f3b2f; border-color:#8f3b2f; box-shadow:0 6px 16px rgba(143,59,47,.2); }
  .scene-tab[data-scene="risk"].active { background:#9a5a2f; border-color:#9a5a2f; box-shadow:0 6px 16px rgba(154,90,47,.2); }
  .scene-tab[data-scene="human"].active { background:#a54832; border-color:#a54832; box-shadow:0 6px 16px rgba(165,72,50,.2); }
  .chat { flex:1; overflow-y:auto; padding: 24px; display:flex; flex-direction:column; gap:14px; scroll-behavior:smooth; }
  .msg { max-width:min(82%, 680px); padding: 11px 15px; border-radius: 16px; font-size: 14px; line-height: 1.7; white-space: pre-wrap; overflow-wrap:anywhere; }
  .msg.customer { align-self: flex-start; background: #ebe8df; border-top-left-radius: 5px; }
  .msg.agent { align-self: flex-end; background: var(--xhs-red); color:#fff; border-top-right-radius: 5px; box-shadow:0 10px 24px rgba(36,92,71,.14); }
  .msg.agent strong { color:#fff4c9; }
  .msg.system { align-self: center; font-size:12px; color:var(--muted); background:none; padding:4px; }
  .human-alert {
    align-self:stretch; background:#fff4e8; border:1px solid #e7b894; border-left:4px solid #a54832;
    border-radius:12px; padding:12px 14px; color:#5b3025; font-size:13px; line-height:1.6;
  }
  .human-alert .human-title { display:flex; align-items:center; justify-content:space-between; gap:10px; font-weight:700; margin-bottom:4px; }
  .human-alert .human-badge { flex:0 0 auto; font-size:11px; background:#a54832; color:#fff; padding:2px 8px; border-radius:999px; }
  .input-bar { display:flex; padding:14px 18px; gap:10px; border-top:1px solid var(--border); background:var(--panel-bg); }
  .input-bar input { flex:1; padding:10px 14px; border:1px solid var(--border); border-radius:20px; font-size:14px; outline:none; }
  .input-bar input:focus { border-color: var(--xhs-red); box-shadow:0 0 0 3px rgba(36,92,71,.12); }
  .btn {
    padding: 10px 18px; border:none; border-radius:20px; cursor:pointer;
    font-size:14px; font-weight:600; background: var(--xhs-red); color:#fff; transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .btn:hover:not(:disabled) { transform:translateY(-1px); box-shadow:0 7px 18px rgba(36,92,71,.16); }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .btn.secondary { background:#fff; color:var(--text); border:1px solid var(--border); }
  /* 右侧链路面板 */
  .trace { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .trace-step {
    background:#fff; border:1px solid var(--border); border-radius:10px;
    padding:12px 14px; box-shadow: var(--shadow); font-size:13px;
  }
  .trace-step .head { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .trace-step .kind {
    font-size:11px; padding:2px 8px; border-radius:6px; font-weight:600;
    background:#eef; color:var(--blue);
  }
  .trace-step .kind.tool { background:#e8ffee; color:var(--green); }
  .trace-step .kind.policy { background:#fff3e0; color:var(--orange); }
  .trace-step .kind.action { background:#fff7e6; color:var(--orange); }
  .trace-step .kind.security { background:#ffd5d5; color:#c00; }
  .trace-step .kind.human { background:#ffe5d2; color:#963d2b; }
  .trace-step .name { font-weight:600; }
  .trace-step .status-ok { color: var(--green); margin-left:auto; }
  .trace-step .status-rejected { color: #c00; margin-left:auto; }
  .trace-step .status-pending { color: var(--orange); margin-left:auto; }
  .trace-step .detail { color: var(--muted); font-family: ui-monospace, monospace; font-size:12px; margin-top:4px; word-break:break-all; }
  .trace-reply {
    background: #edf4ef; border:1px solid #cfdfd4; border-radius:10px;
    padding:12px 14px; font-size:13px; line-height:1.6;
  }
  .trace-reply .label { color: var(--xhs-red); font-weight:600; margin-bottom:4px; }
  .actions-panel { border-top:1px solid var(--border); padding:14px 18px; background:var(--panel-bg); max-height:310px; overflow-y:auto; }
  .actions-panel h3 { font-size:13px; margin-bottom:8px; color:var(--muted); }
  .action-item { border:1px solid var(--border); border-radius:8px; padding:8px 12px; margin-bottom:6px; font-size:13px; }
  .action-item .row { display:flex; gap:8px; align-items:center; }
  .action-item .btn { font-size:12px; padding:4px 12px; }
  .action-guidance { margin-top:8px; padding:9px 10px; background:#fff8ef; border-radius:8px; color:#5f5148; font-size:12px; line-height:1.55; }
  .action-guidance strong { color:#8e3f2f; }
  .action-guidance ul { margin:4px 0 0 18px; }
  .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  :focus-visible { outline:3px solid rgba(197,109,60,.45); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior:auto !important; transition:none !important; }

  @media (max-width: 900px) {

    .chat { min-height:430px; padding:16px; }
    .pane.right .trace { flex:0 0 auto; min-height:280px; overflow:visible; }
    .msg { max-width:92%; }

</style>

async function fetchJSON(url, options = {}, timeoutMs = 65000) {
  const controller = new AbortController();
  const timeout = window.setTimeout(() => controller.abort(), timeoutMs);
  try {
    const headers = new Headers(options.headers || {});
    if (API_KEY) headers.set("X-API-Key", API_KEY);
    const response = await fetch(url, { ...options, headers, signal: controller.signal });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) {
      const detail = data.detail || `请求失败（HTTP ${response.status}）`;
      throw new Error(typeof detail === "string" ? detail : JSON.stringify(detail));
    }
    return data;
  } catch (error) {
    if (error.name === "AbortError") throw new Error("请求超时，请稍后重试");
    throw error;
  } finally {
    window.clearTimeout(timeout);
  }
}

async function healthCheck() {
  try {
    const j = await fetchJSON("/health", {}, 5000);
    statusText.textContent = `后端正常 · ${j.platform || "未知平台"} · 模式: ${j.llm_mode} · 模型: ${j.llm_model}`;
    statusDot.className = "dot";
  } catch (e) {
    statusText.textContent = "后端未连接";
    statusDot.className = "dot warn";
  }
}

function renderRichText(element, text) {
  const parts = String(text || "").split(/(\*\*[^*]+\*\*|\n)/g);
  parts.forEach((part) => {
    if (part === "\n") {
      element.appendChild(document.createElement("br"));
    } else if (part.startsWith("**") && part.endsWith("**")) {
      const strong = document.createElement("strong");
      strong.textContent = part.slice(2, -2);
      element.appendChild(strong);
    } else if (part) {
      element.appendChild(document.createTextNode(part));
    }
  });
}

function addMsg(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  if (role === "agent") renderRichText(div, text);
  else div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

function addHumanPrompt(prompt) {
  if (!prompt) return;
  const card = document.createElement("div");
  card.className = "human-alert";
  card.setAttribute("role", "status");
  const title = document.createElement("div");
  title.className = "human-title";
  const titleText = document.createElement("span");
  titleText.textContent = "🙋 " + (prompt.title || "需要人工介入");
  const badge = document.createElement("span");
  badge.className = "human-badge";
  badge.textContent = prompt.priority || "待处理";
  title.appendChild(titleText);
  title.appendChild(badge);
  const reason = document.createElement("div");
  reason.textContent = "介入原因：" + (prompt.reason_label || "需要人工进一步核实");
  const notice = document.createElement("div");
  notice.textContent = prompt.customer_notice || "已提交人工处理，请留意平台消息。";
  card.appendChild(title);
  card.appendChild(reason);
  card.appendChild(notice);
  chatEl.appendChild(card);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function kindClass(kind) {
  if (kind === "tool") return "tool";
  if (kind === "policy") return "policy";
  if (kind === "action") return "action";
  if (kind === "security") return "security";
  return "";
}

function renderTrace(response) {

  const container = document.createElement("div");
  container.style.cssText = "border-left:3px solid #245c47; padding-left:10px;";

  const intent = document.createElement("div");

  const intentLabel = document.createElement("div");
  intentLabel.className = "label";
  intentLabel.textContent = "意图识别";
  intent.appendChild(intentLabel);
  const intentText = document.createElement("div");
  intentText.textContent = "intent = " + (response.intent || "?");
  intent.appendChild(intentText);
  container.appendChild(intent);

  if (response.safety && (response.safety.ok === false || response.safety.reason_code)) {
    const step = document.createElement("div");
    step.className = "trace-step";
    const head = document.createElement("div");
    head.className = "head";
    const kind = document.createElement("span");
    kind.className = "kind security";
    kind.textContent = "SECURITY";
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = "入站安全护栏";
    const status = document.createElement("span");
    status.className = response.safety.ok === false ? "status-rejected" : "status-pending";
    status.textContent = response.safety.ok === false ? "已拦截" : "已脱敏";
    head.appendChild(kind); head.appendChild(name); head.appendChild(status);
    step.appendChild(head);
    const detail = document.createElement("div");
    detail.className = "detail";
    detail.textContent = `${response.safety.reason_code || "SECURITY_REJECTED"} · ${response.safety.detail || "请求未通过安全检查"}`;
    step.appendChild(detail);
    container.appendChild(step);
  }

  (response.tool_calls || []).forEach((tc) => {
    const step = document.createElement("div");
    step.className = "trace-step";
    const head = document.createElement("div");
    head.className = "head";
    const k = document.createElement("span");
    k.className = "kind tool";
    k.textContent = "TOOL";
    const n = document.createElement("span");
    n.className = "name";
    n.textContent = tc.name;
    const s = document.createElement("span");
    s.className = "status-" + (tc.status === "ok" ? "ok" : "rejected");
    const latency = Number.isFinite(tc.latency_ms) ? ` · ${tc.latency_ms}ms` : "";
    s.textContent = (tc.status || "ok") + latency;
    head.appendChild(k); head.appendChild(n); head.appendChild(s);
    step.appendChild(head);
    const d = document.createElement("div");
    d.className = "detail";
    d.textContent = JSON.stringify(tc.args);
    step.appendChild(d);
    container.appendChild(step);
  });

  if (response.policy) {
    const step = document.createElement("div");
    step.className = "trace-step";
    const head = document.createElement("div");
    head.className = "head";
    const k = document.createElement("span");
    k.className = "kind policy";
    k.textContent = "POLICY";
    const n = document.createElement("span");
    n.className = "name";
    n.textContent = "风控决策";
    const s = document.createElement("span");
    s.className = response.policy.outcome === "deny" ? "status-rejected" : "status-pending";
    s.textContent = response.policy.outcome + " (" + response.policy.reason_code + ")";
    head.appendChild(k); head.appendChild(n); head.appendChild(s);
    step.appendChild(head);
    const d = document.createElement("div");
    d.className = "detail";
    d.textContent = response.policy.explanation;
    step.appendChild(d);
    container.appendChild(step);
  }

  if (response.pending_action) {
    const step = document.createElement("div");
    step.className = "trace-step";
    const head = document.createElement("div");
    head.className = "head";
    const k = document.createElement("span");
    k.className = "kind action";
    k.textContent = "ACTION";
    const n = document.createElement("span");
    n.className = "name";
    n.textContent = response.pending_action.type;
    const s = document.createElement("span");
    s.className = "status-pending";
    s.textContent = response.pending_action.state;
    head.appendChild(k); head.appendChild(n); head.appendChild(s);
    step.appendChild(head);
    const d = document.createElement("div");
    d.className = "detail";
    d.textContent = "action_id: " + response.pending_action.action_id;
    step.appendChild(d);
    container.appendChild(step);
  }

  if (response.human_prompt) {
    const prompt = response.human_prompt;
    const step = document.createElement("div");
    step.className = "trace-step";
    const head = document.createElement("div");
    head.className = "head";
    const kind = document.createElement("span");
    kind.className = "kind human";
    kind.textContent = "HUMAN";
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = prompt.reason_label || "人工介入";
    const status = document.createElement("span");
    status.className = "status-pending";
    status.textContent = prompt.priority || "待处理";
    head.appendChild(kind); head.appendChild(name); head.appendChild(status);
    step.appendChild(head);
    const detail = document.createElement("div");
    detail.className = "detail";
    detail.textContent = `${prompt.sla || "尽快响应"} · ${prompt.next_action || "核实后处理"}`;
    step.appendChild(detail);
    container.appendChild(step);
  }

  const reply = document.createElement("div");
  reply.className = "trace-reply";
  const rl = document.createElement("div");
  rl.className = "label";
  rl.textContent = "最终回复（status: " + response.status + "）";
  reply.appendChild(rl);
  const rc = document.createElement("div");
  renderRichText(rc, response.reply || "(空)");
  reply.appendChild(rc);
  container.appendChild(reply);

  traceEl.appendChild(container);
  traceEl.scrollTop = traceEl.scrollHeight;
}

async function decide(text, customerId) {
  const payload = {
    text: text,
    session_key: customerId,
  };
  return fetchJSON("/zhixia/decide", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  });
}

async function sendMessage(text, customerId) {
  if (!text.trim() || isSending) return;
  isSending = true;
  addMsg("customer", text);
  inputEl.value = "";
  sendBtn.disabled = true;
  inputEl.disabled = true;
  document.querySelectorAll("[data-script-button]").forEach((button) => { button.disabled = true; });
  document.querySelectorAll(".scene-tab").forEach((button) => { button.disabled = true; });
  const thinking = addMsg("agent", "…");
  try {
    const resp = await decide(text, customerId);
    thinking.remove();
    if (resp.deduplicated) {
      addMsg("system", "（消息去重，复用已有回复）");
    }
    addMsg("agent", resp.reply || "(无回复)");
    addHumanPrompt(resp.human_prompt);
    renderTrace(resp);
  } catch (e) {
    thinking.remove();
    addMsg("agent", "后端调用失败：" + e.message);
  } finally {
    isSending = false;
    sendBtn.disabled = false;
    inputEl.disabled = false;
    inputEl.focus();
    document.querySelectorAll("[data-script-button]").forEach((button) => { button.disabled = false; });
    document.querySelectorAll(".scene-tab").forEach((button) => { button.disabled = false; });
    refreshActions();
  }
}

function switchScene(scene) {
  currentScene = scene;
  document.querySelectorAll(".scene-tab").forEach((t) => {
    const active = t.dataset.scene === scene;
    t.classList.toggle("active", active);
    t.setAttribute("aria-pressed", String(active));
  });
  chatEl.innerHTML = "";
  traceEl.innerHTML = "";
  const s = SCENES[scene];
  addMsg("system", "—— 已切换到「" + s.label + "」场景（顾客 " + s.customerId + "）——");
  // 自动播放场景脚本（可点击逐条，此处一次性指导）
  addMsg("system", `可点击下方 ${s.script.length} 条脚本逐条体验，或手动输入消息。`);
  // 不自动发送，由用户点下方按钮
  showScriptButtons(s);
}

function showScriptButtons(s) {
  // 在聊天区顶部插入脚本快捷按钮
  const bar = document.createElement("div");
  bar.className = "input-bar";
  bar.style.cssText = "flex-wrap:wrap;";
  s.script.forEach((line, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.dataset.scriptButton = "true";
    b.className = "btn secondary";
    b.textContent = (i + 1) + ". " + (line.length > 18 ? line.slice(0, 18) + "…" : line);
    b.title = line;
    b.setAttribute("aria-label", `运行测试提示词 ${i + 1}：${line}`);
    b.style.cssText = "font-size:12px; padding:6px 12px; border-radius:14px;";
    b.onclick = () => sendMessage(line, currentSessionId());
    bar.appendChild(b);
  });
  chatEl.appendChild(bar);
  chatEl.scrollTop = chatEl.scrollHeight;
}

async function refreshActions() {
  // 现在改为展示人工审批队列
  await refreshModeration();
}

async function handleHandoff(action) {
  if (isHandoffUpdating) return;
  isHandoffUpdating = true;
  const takeOverButton = document.getElementById("takeOverBtn");
  const releaseButton = document.getElementById("releaseBtn");
  takeOverButton.disabled = true;
  releaseButton.disabled = true;
  const selectedId = document.getElementById("manualCustomerSelect").value;
  const selectedTarget = moderationTargets.get(selectedId);
  const sid = selectedTarget ? selectedTarget.customerId : currentSessionId();
  const sessionKey = selectedTarget ? selectedTarget.sessionKey : "zhixia|" + sid;
  try {
    await fetchJSON("/v1/handoff", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_key: sessionKey, action: action }),
    });
    addMsg("system", (action === "take_over" ? "🚫 已接管会话，Agent 停止自动回复" : "✅ 已恢复自动回复") + `（${sid}）`);
  } catch (error) {
    addMsg("system", "会话状态更新失败：" + error.message);
  } finally {
    isHandoffUpdating = false;
    takeOverButton.disabled = false;
    releaseButton.disabled = false;
  }
}

// 手写回复发送到千帆（转人工后的实际操作）
async function sendManualReply() {
  if (isManualReplySending) return;
  const input = document.getElementById("manualReplyInput");
  const button = document.getElementById("manualReplyBtn");
  const targetSelect = document.getElementById("manualCustomerSelect");
  const target = moderationTargets.get(targetSelect.value);
  const text = input.value.trim();
  if (!target) { addMsg("system", "⚠️ 请先从待办中选择要回复的顾客"); return; }
  if (!text) { addMsg("system", "⚠️ 请输入要发送的内容"); return; }
  isManualReplySending = true;
  input.disabled = true;
  button.disabled = true;
  const sid = target.customerId;
  const sessionKey = target.sessionKey;
  try {
    await fetchJSON("/v1/outbox", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_key: sessionKey, customer_id: sid, content: text, channel: "xhs_qianfan" }),
    });
    input.value = "";
    addMsg("system", "✍️ 已加入发送队列，将自动回填到千帆");
    addMsg("agent", text);
  } catch (error) {
    addMsg("system", "手写回复入队失败：" + error.message);
  } finally {
    isManualReplySending = false;
    input.disabled = false;
    button.disabled = false;
    input.focus();
  }
}

// 浏览器桌面通知
let lastPendingCount = 0;
function notifyPending(items) {
  const hasNew = items.length > lastPendingCount;
  lastPendingCount = items.length;
  if (hasNew && items.length > 0 && "Notification" in window && Notification.permission === "granted") {
    const kinds = items.map(m => m.kind === "handoff" ? "转人工" : (m.kind === "reply" ? "待审回复" : "写操作")).join("、");
    new Notification("小红书客服待办", { body: `${items.length} 条待人工处理：${kinds}` });
  }
}

function refreshManualTargets(items) {
  const select = document.getElementById("manualCustomerSelect");
  const button = document.getElementById("manualReplyBtn");
  const previous = select.value;
  moderationTargets = new Map();
  select.innerHTML = "";
  const placeholder = document.createElement("option");
  placeholder.value = "";
  placeholder.textContent = items.length ? "请选择待办顾客…" : "暂无可选待办顾客";
  select.appendChild(placeholder);
  items.forEach((item) => {
    const customerId = String(item.customer_id || "").trim();
    const sessionKey = String(item.session_key || "").trim();
    if (!customerId || !sessionKey) return;
    moderationTargets.set(item.id, { customerId, sessionKey });
    const option = document.createElement("option");
    option.value = item.id;
    option.textContent = `${customerId} · ${item.intent || item.reason_code || "待处理"}`;
    select.appendChild(option);
  });
  if (previous && moderationTargets.has(previous)) select.value = previous;
  else if (moderationTargets.size === 1) select.value = moderationTargets.keys().next().value;
  button.disabled = moderationTargets.size === 0;
}

async function refreshModeration() {
  if (moderationInFlight) return;
  moderationInFlight = true;
  try {
    const j = await fetchJSON("/v1/moderation?status=pending", {}, 5000);
    const el = document.getElementById("moderation");
    const items = j.moderation || [];
    notifyPending(items);
    const snapshot = JSON.stringify(items);
    if (snapshot === lastModerationSnapshot) return;
    lastModerationSnapshot = snapshot;
    refreshManualTargets(items);
    el.innerHTML = "";
    el.style.color = "";
    el.style.fontSize = "";
    if (items.length === 0) {
      el.innerHTML = '<div style="color:#86909c;font-size:13px;">暂无待审批项（普通咨询会自动回复，无需审批）</div>';
      return;
    }
    items.forEach((m) => {
      const item = document.createElement("div");
      item.className = "action-item";
      item.style.borderLeft = m.kind === "handoff" ? "3px solid #c56d3c" : "3px solid #245c47";
      const row = document.createElement("div");
      row.className = "row";
      const kindLabel = m.kind === "handoff" ? "🙋 转人工" : (m.kind === "reply" ? "💬 待审回复" : "⚙️ 写操作");
      const label = document.createElement("b");
      label.textContent = kindLabel;
      const meta = document.createElement("span");
      meta.style.color = "#738078";
      meta.textContent = `${(m.id || "").slice(0, 12)} · ${m.intent || ""}`;
      row.appendChild(label);
      row.appendChild(meta);
      const ok = document.createElement("button");
      ok.type = "button";
      ok.className = "btn";
      ok.textContent = m.kind === "handoff" ? "标记已接手" : (m.kind === "reply" ? "通过并发送" : "通过");
      ok.onclick = async () => {
        ok.disabled = true;
        no.disabled = true;
        try {
          await fetchJSON(`/v1/moderation/${m.id}/approve`, { method: "POST" });
          lastModerationSnapshot = "";
          refreshModeration();
          const message = m.kind === "handoff"
            ? "✅ 已标记为人工接手"
            : "✅ 已审批通过" + (m.kind === "reply" ? "并加入发送队列" : "");
          addMsg("system", message + "：" + (m.content || "").slice(0, 30));
        } catch (error) {
          addMsg("system", "审批失败：" + error.message);
          ok.disabled = false;
          no.disabled = false;
        }
      };
      const no = document.createElement("button");
      no.type = "button";
      no.className = "btn secondary";
      no.textContent = "❌ 拒绝";
      no.style.marginLeft = "6px";
      no.onclick = async () => {
        ok.disabled = true;
        no.disabled = true;
        try {
          await fetchJSON(`/v1/moderation/${m.id}/reject`, { method: "POST" });
          lastModerationSnapshot = "";
          refreshModeration();
          addMsg("system", "❌ 已拒绝该待审项");
        } catch (error) {
          addMsg("system", "拒绝操作失败：" + error.message);
          ok.disabled = false;
          no.disabled = false;
        }
      };
      row.appendChild(ok);
      row.appendChild(no);
      item.appendChild(row);
      const detail = document.createElement("div");
      detail.style.cssText = "color:#86909c;font-size:12px;margin-top:4px;word-break:break-all;";
      detail.textContent = (m.content || '').slice(0,120) + "  [" + (m.reason_code || '') + "]";
      item.appendChild(detail);
      if (m.human_prompt) {
        const prompt = m.human_prompt;
        const guide = document.createElement("div");
        guide.className = "action-guidance";
        const summary = document.createElement("div");
        const strong = document.createElement("strong");
        strong.textContent = `${prompt.priority || "待处理"} · ${prompt.reason_label || "需人工处理"}`;
        summary.appendChild(strong);
        summary.appendChild(document.createTextNode(` · ${prompt.sla || "尽快响应"}`));
        const next = document.createElement("div");
        next.textContent = "建议动作：" + (prompt.next_action || "核实后处理");
        guide.appendChild(summary);
        guide.appendChild(next);
        if (Array.isArray(prompt.checklist) && prompt.checklist.length) {
          const list = document.createElement("ul");
          prompt.checklist.forEach((entry) => {
            const li = document.createElement("li");
            li.textContent = entry;
            list.appendChild(li);
          });
          guide.appendChild(list);
        }
        item.appendChild(guide);
      }
      el.appendChild(item);
    });
  } catch (error) {
    lastModerationSnapshot = "";
    const el = document.getElementById("moderation");
    el.textContent = "待办加载失败：" + error.message;
    el.style.color = "#b34f36";
    el.style.fontSize = "13px";
  } finally {
    moderationInFlight = false;
  }
}

// 事件绑定
document.querySelectorAll(".scene-tab").forEach((t) => {
  t.addEventListener("click", () => switchScene(t.dataset.scene));
});
sendBtn.addEventListener("click", () => sendMessage(inputEl.value, currentSessionId()));
inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.isComposing) {
    e.preventDefault();
    sendMessage(inputEl.value, currentSessionId());
  }
});
document.getElementById("takeOverBtn").addEventListener("click", () => handleHandoff("take_over"));
document.getElementById("releaseBtn").addEventListener("click", () => handleHandoff("release"));
document.getElementById("manualReplyBtn").addEventListener("click", sendManualReply);
document.getElementById("manualReplyInput").addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.isComposing) {
    event.preventDefault();
    sendManualReply();
  }
});
document.getElementById("notificationBtn").addEventListener("click", async () => {
  const button = document.getElementById("notificationBtn");
  if (!("Notification" in window)) {
    addMsg("system", "当前浏览器不支持桌面通知");
    return;
  }
  try {
    const permission = await Notification.requestPermission();
    button.textContent = permission === "granted" ? "待办提醒已开启" : "待办提醒未开启";
  } catch (error) {
    button.textContent = "待办提醒未开启";
    addMsg("system", "桌面通知开启失败：" + error.message);
  }
});

// 初始化
switchScene("pre");
let healthPollTimer = null;
let moderationPollTimer = null;

async function pollHealth() {
  if (document.hidden) return;
  await healthCheck();
  if (!document.hidden) healthPollTimer = window.setTimeout(pollHealth, 30000);
}

async function pollModeration() {
  if (document.hidden) return;
  await refreshModeration();
  if (!document.hidden) moderationPollTimer = window.setTimeout(pollModeration, 5000);
}

function restartPolling() {
  window.clearTimeout(healthPollTimer);
  window.clearTimeout(moderationPollTimer);
  healthPollTimer = null;
  moderationPollTimer = null;
  if (!document.hidden) {
    pollHealth();
    pollModeration();
  }
}

document.addEventListener("visibilitychange", restartPolling);
restartPolling();
</script>
